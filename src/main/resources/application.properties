server.port=3333
# Compress the compiled stylesheet and local scripts on first transfer.
server.compression.enabled=true
server.compression.min-response-size=1KB
server.compression.mime-types=text/html,text/css,text/javascript,application/javascript,application/json
spring.application.name=mvn-builder
spring.datasource.url=jdbc:h2:file:./data/mvnbuilder;DB_CLOSE_ON_EXIT=FALSE;DEFAULT_LOCK_TIMEOUT=10000
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.h2.console.enabled=true
spring.jpa.hibernate.ddl-auto=update
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Logging
logging.level.net.olaba.mvnbuilder=DEBUG
logging.file.name=${user.home}/.mvnbuilder/mvnbuilder.log

# App version and Update configurations
app.version=@project.version@
app.update.check-url=https://api.github.com/repos/jonolabarrieta/maven-builder-web-ui/releases/latest
