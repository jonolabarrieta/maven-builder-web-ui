<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><body>
<tr th:fragment="header(group, members, blockKey)" class="workspace-group-header bg-gray-50"
    th:with="displayName=${group.imported ? group.parentWorkspace.name : group.name}"
    th:attr="data-group-id=${group.id},data-block-key=${blockKey},data-imported=${group.imported}">
    <td colspan="7" class="px-4 sm:px-6 py-4">
        <div class="flex flex-wrap items-center justify-between gap-3">
            <div class="flex flex-wrap items-center gap-3 min-w-0">
                <input type="checkbox" class="group-checkbox w-4 h-4" th:attr="data-group-id=${group.id}" th:aria-label="${'Select group ' + displayName}">
                <button type="button" class="group-disclosure text-indigo-700 font-semibold px-2 py-1 rounded-lg hover:bg-indigo-50" aria-expanded="true" th:attr="data-group-id=${group.id},data-group-name=${displayName},aria-controls=${#strings.listJoin(members.![ 'project-row-' + id ], ' ')}" th:aria-label="${'Collapse group ' + displayName}">Collapse</button>
                <strong th:text="${displayName}" class="break-all">Group</strong>
                <span class="text-sm text-gray-600" th:text="${members.size() + (members.size() == 1 ? ' project' : ' projects')}"></span>
                <a th:if="${group.imported}" th:href="@{/workspaces/{id}(id=${group.parentWorkspace.id})}" class="text-sm text-indigo-700 underline">Open parent workspace</a>
            </div>
            <div class="flex flex-wrap items-center gap-2">
                <button type="button" th:unless="${group.imported}"
                        class="group-edit border border-indigo-200 text-indigo-700 rounded-lg px-3 py-2 text-sm font-semibold hover:bg-indigo-50"
                        th:attr="hx-get=@{/workspaces/{id}/groups/{gid}/edit-modal(id=${workspace.id},gid=${group.id})}"
                        hx-target="#group-modal-content"
                        onclick="openGroupModal()">Edit group</button>
                <button type="button" class="group-build bg-indigo-600 hover:bg-indigo-700 text-white rounded-lg px-3 py-2 text-sm font-semibold" th:attr="data-group-id=${group.id}">Build group</button>
                <button type="button" class="block-move border border-gray-200 rounded-lg px-2 py-1 text-sm" data-direction="-1" th:aria-label="${'Move group ' + displayName + ' up'}">Move up</button>
                <button type="button" class="block-move border border-gray-200 rounded-lg px-2 py-1 text-sm" data-direction="1" th:aria-label="${'Move group ' + displayName + ' down'}">Move down</button>
            </div>
        </div>
        <details class="mt-2">
            <summary class="text-sm text-indigo-700 cursor-pointer">Group actions and settings</summary>
            <div class="mt-3 flex flex-wrap gap-6 items-start">
                <form class="group-action-form flex flex-wrap items-end gap-2" th:attr="data-group-id=${group.id},data-group-name=${displayName}">
                    <label class="text-sm">Action<select name="action" class="block border border-gray-200 rounded-lg px-2 py-2">
                        <option value="fetch">Git fetch</option><option value="pull">Git pull</option><option value="checkout">Git checkout / create branch</option><option value="stash">Git stash</option><option value="discard">Discard unstaged changes</option><option value="unstage">Unstage changes</option><option value="enable">Enable projects</option><option value="disable">Disable projects</option><option value="build">Build</option>
                    </select></label>
                    <label class="text-sm">Branch or reference<input name="branch" class="block border border-gray-200 rounded-lg px-2 py-2" placeholder="For checkout" autocomplete="off"></label>
                    <label class="text-sm"><input type="checkbox" name="createNew"> Create branch</label>
                    <label class="text-sm"><input type="checkbox" name="includeUntracked"> Include untracked in stash</label>
                    <label class="text-sm"><input type="checkbox" name="selectedOnly"> Selected members only</label>
                    <button class="border border-indigo-200 text-indigo-700 rounded-lg px-3 py-2 text-sm font-semibold">Run action</button>
                </form>
                <form class="group-refresh-form" th:action="@{/workspaces/{id}/groups/{gid}/refresh(id=${workspace.id},gid=${group.id})}" method="post"><button class="text-sm text-indigo-700 underline">Refresh group</button></form>
                <form th:unless="${group.imported}" th:action="@{/workspaces/{id}/groups/{gid}/rename(id=${workspace.id},gid=${group.id})}" method="post" class="flex flex-wrap gap-2">
                    <label class="text-sm">Group name<input name="name" th:value="${displayName}" maxlength="255" required class="block border border-gray-200 rounded-lg px-2 py-2"></label><button class="self-end text-sm text-indigo-700 underline py-2">Rename</button>
                </form>
                <form th:action="@{/workspaces/{id}/groups/{gid}/delete(id=${workspace.id},gid=${group.id})}" method="post" class="group-delete-form">
                    <input type="hidden" name="deleteProjects" value="false">
                    <button type="button" class="text-sm text-danger underline"
                            th:attr="data-confirm-group-remove=${displayName},data-group-id=${group.id},data-imported=${group.imported}"
                            th:text="${group.imported ? 'Remove parent workspace' : 'Delete group'}">Delete group</button>
                </form>
            </div>
        </details>
    </td>
</tr>
</body></html>
