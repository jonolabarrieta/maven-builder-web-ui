<div th:fragment="branch-list" class="flex flex-col animate-in fade-in zoom-in duration-200" id="branch-modal-content-inner" th:attr="data-consumer-id=${consumerId},data-context-group-id=${contextGroupId}">
    <div class="px-6 py-4 border-b border-gray-100 flex justify-between items-center bg-gray-50/50">
        <div>
            <h3 class="text-lg font-bold text-gray-800" th:text="${project.artifactId}">Project Name</h3>
            <p class="text-[10px] font-bold text-muted uppercase tracking-widest">Git References</p>
            <p th:if="${currentReference != null}" th:text="${currentReference.label}"
               th:title="${currentReference.description}" class="text-xs text-muted break-all mt-1"></p>
        </div>
        <button type="button" aria-label="Close Select Branch" onclick="document.getElementById('branch-modal').classList.add('hidden')" class="icon-button text-muted hover:text-gray-600 transition-colors p-2 hover:bg-gray-100 rounded-lg">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
            </svg>
        </button>
    </div>

    <!-- Tab Navigation & Fetch Button -->
    <div class="px-4 sm:px-6 border-b border-gray-100 bg-gray-50/30 flex flex-wrap justify-between items-center gap-2">
        <div class="flex space-x-4">
            <button id="branch-tab-btn-local" onclick="switchBranchTab('local')" class="branch-tab-btn py-3 text-xs font-bold uppercase tracking-wider border-b-2 border-indigo-600 text-indigo-600 outline-none transition-all">
                Local
            </button>
            <button id="branch-tab-btn-remote" onclick="switchBranchTab('remote')" class="branch-tab-btn py-3 text-xs font-bold uppercase tracking-wider border-b-2 border-transparent text-muted hover:text-gray-700 hover:border-gray-300 outline-none transition-all">
                Remote
            </button>
            <button id="branch-tab-btn-tags" onclick="switchBranchTab('tags')" class="branch-tab-btn py-3 text-xs font-bold uppercase tracking-wider border-b-2 border-transparent text-muted hover:text-gray-700 hover:border-gray-300 outline-none transition-all">
                Tags
            </button>
        </div>
        
        <button th:attr="hx-post=@{/projects/{id}/branches/fetch(id=${project.id})}"
                hx-target="#branch-modal-content"
                hx-swap="innerHTML"
                data-no-spinner="true"
                hx-on:htmx:after-request="if(!event.detail.successful){resetBranchLoading();}"
                onclick="document.getElementById('branch-list-container').classList.add('hidden'); document.getElementById('branch-loading').classList.remove('hidden');"
                class="flex items-center space-x-1 px-3 py-1.5 text-xs font-semibold text-gray-600 bg-white border border-gray-200 rounded-lg hover:bg-gray-50 transition-all shadow-sm group/modal-fetch"
                title="Git Fetch">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-3.5 w-3.5 text-muted group-hover/modal-fetch:text-indigo-500 transition-colors" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
            </svg>
            <span>Fetch</span>
        </button>
    </div>

    <div class="p-4 sm:p-6">
        <!-- Spinner (hidden by default) -->
        <div id="branch-loading" class="hidden py-12 text-center">
            <div class="animate-spin rounded-full h-8 w-8 border-b-2 border-indigo-600 mx-auto mb-4"></div>
            <p class="text-sm font-medium text-muted">Processing request...</p>
        </div>

        <div id="branch-list-container" class="space-y-6">
            <div>
                <!-- Local branches -->
                <div id="branch-panel-local" class="branch-tab-panel space-y-1">
                    <label class="text-[10px] font-bold text-muted uppercase tracking-widest block mb-3">Local Branches</label>
                    <div class="max-h-60 overflow-y-auto space-y-1 pr-1 custom-scrollbar">
                        <button th:each="branch : ${branches}" 
                                th:attr="data-project-id=${project.id},data-ref=${branch.ref},data-ref-type=${branch.type},data-ref-name=${branch.name},data-local-branch=${branch.localBranch}"
                                type="button" onclick="confirmAndCheckout(this)"
                                th:class="${currentReference != null and currentReference.isActive(branch) ? 'w-full text-left px-4 py-3 text-sm font-bold text-indigo-600 bg-indigo-50 rounded-xl flex items-center justify-between' : 'w-full text-left px-4 py-3 text-sm text-gray-600 hover:bg-gray-50 rounded-xl transition-colors border border-transparent hover:border-gray-100'}"
                                >
                            <span th:text="${branch.name}">branch-name</span>
                            <svg th:if="${currentReference != null and currentReference.isActive(branch)}" xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 text-indigo-600" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7" />
                            </svg>
                        </button>
                        <div th:if="${#lists.isEmpty(branches)}" class="py-6 text-center text-xs text-muted font-medium">
                            No local branches found.
                        </div>
                    </div>
                </div>

                <!-- Remote branches -->
                <div id="branch-panel-remote" class="branch-tab-panel hidden space-y-1">
                    <label class="text-[10px] font-bold text-muted uppercase tracking-widest block mb-3">Remote Branches</label>
                    <div class="max-h-60 overflow-y-auto space-y-1 pr-1 custom-scrollbar">
                        <button th:each="branch : ${remoteBranches}" 
                                th:attr="data-project-id=${project.id},data-ref=${branch.ref},data-ref-type=${branch.type},data-ref-name=${branch.name},data-local-branch=${branch.localBranch}"
                                type="button" onclick="confirmAndCheckout(this)"
                                th:class="${currentReference != null and currentReference.isActive(branch) ? 'w-full text-left px-4 py-3 text-sm font-bold text-indigo-600 bg-indigo-50 rounded-xl flex items-center justify-between' : 'w-full text-left px-4 py-3 text-sm text-gray-600 hover:bg-gray-50 rounded-xl transition-colors border border-transparent hover:border-gray-100'}"
                                >
                            <span th:text="${branch.name}">branch-name</span>
                            <svg th:if="${currentReference != null and currentReference.isActive(branch)}" xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 text-indigo-600" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7" />
                            </svg>
                        </button>
                        <div th:if="${#lists.isEmpty(remoteBranches)}" class="py-6 text-center text-xs text-muted font-medium">
                            No remote branches found.
                        </div>
                    </div>
                </div>

                <!-- Tags -->
                <div id="branch-panel-tags" class="branch-tab-panel hidden space-y-1">
                    <label class="text-[10px] font-bold text-muted uppercase tracking-widest block mb-3">Git Tags</label>
                    <div class="max-h-60 overflow-y-auto space-y-1 pr-1 custom-scrollbar">
                        <button th:each="tag : ${tags}" 
                                th:attr="data-project-id=${project.id},data-ref=${tag.ref},data-ref-type=${tag.type},data-ref-name=${tag.name},data-local-branch=${tag.localBranch}"
                                type="button" onclick="confirmAndCheckout(this)"
                                th:class="${currentReference != null and currentReference.isActive(tag) ? 'w-full text-left px-4 py-3 text-sm font-bold text-indigo-600 bg-indigo-50 rounded-xl flex items-center justify-between' : 'w-full text-left px-4 py-3 text-sm text-gray-600 hover:bg-gray-50 rounded-xl transition-colors border border-transparent hover:border-gray-100'}"
                                >
                            <span th:text="${tag.name}">tag-name</span>
                            <svg th:if="${currentReference != null and currentReference.isActive(tag)}" xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 text-indigo-600" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7" />
                            </svg>
                        </button>
                        <div th:if="${#lists.isEmpty(tags)}" class="py-6 text-center text-xs text-muted font-medium">
                            No tags found.
                        </div>
                    </div>
                </div>
            </div>
            
            <div class="pt-6 border-t border-gray-100">
                <form th:attr="hx-post=@{/projects/{id}/create-branch(id=${project.id})}"
                      hx-swap="none"
                      data-no-spinner="true"
                      data-error-modal-handled="true"
                      hx-on:htmx:after-request="handleCreateBranchResult(event)"
                      onsubmit="document.getElementById('branch-list-container').classList.add('hidden'); document.getElementById('branch-loading').classList.remove('hidden');"
                      class="space-y-3">
                    <label for="new-branch-name" class="text-[10px] font-bold text-muted uppercase tracking-widest block">Create New Branch</label>
                    <div class="flex space-x-2">
                        <input type="text" id="new-branch-name" name="branch" required placeholder="feature/new-branch"
                               class="min-w-0 w-full flex-1 px-4 py-2.5 text-sm bg-gray-50 border border-gray-200 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:border-transparent outline-none transition-all">
                        <button type="submit" aria-label="Create branch" class="shrink-0 bg-indigo-600 text-white px-4 py-2.5 rounded-xl hover:bg-indigo-700 transition-all shadow-lg shadow-indigo-100 font-bold">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" />
                            </svg>
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script th:inline="javascript">
        function switchBranchTab(tabName) {
            document.querySelectorAll('.branch-tab-panel').forEach(function(panel) {
                panel.classList.add('hidden');
            });
            document.getElementById('branch-panel-' + tabName).classList.remove('hidden');

            document.querySelectorAll('.branch-tab-btn').forEach(function(btn) {
                btn.classList.remove('border-indigo-600', 'text-indigo-600');
                btn.classList.add('border-transparent', 'text-muted', 'hover:text-gray-700', 'hover:border-gray-300');
            });
            var activeBtn = document.getElementById('branch-tab-btn-' + tabName);
            if (activeBtn) {
                activeBtn.classList.remove('border-transparent', 'text-muted', 'hover:text-gray-700', 'hover:border-gray-300');
                activeBtn.classList.add('border-indigo-600', 'text-indigo-600');
            }
        }

        function confirmAndCheckout(button) {
            var projectId = button.dataset.projectId;
            var ref = button.dataset.ref;
            var refType = button.dataset.refType;
            var refName = button.dataset.refName;
            var message = 'Switch this project to local branch "' + refName + '"?';
            if (refType === 'REMOTE') {
                message = 'Switch to local branch "' + button.dataset.localBranch
                    + '" tracking "' + refName + '"? This does not pull or reset the local branch.';
            } else if (refType === 'TAG') {
                message = 'Check out tag "' + refName
                    + '" at its commit? This leaves HEAD detached, with no local branch active.';
            }
            ConfirmationModal.confirm({
                title: 'Switch Git reference?',
                message: message,
                confirmLabel: 'Switch reference',
                cancelLabel: 'Cancel',
                danger: false,
                onConfirm: function() {
                    document.getElementById('branch-list-container').classList.add('hidden');
                    document.getElementById('branch-loading').classList.remove('hidden');

                    var formData = new FormData();
                    formData.append('branch', ref);
                    formData.append('referenceType', refType);

                    fetch('/projects/' + projectId + '/checkout', {
                        method: 'POST',
                        body: formData,
                        globalSpinner: false
                    })
                    .then(function(response) {
                        if (!response.ok) {
                            return response.text().then(function(text) {
                                throw new Error(text.trim() || 'The selected reference could not be checked out.');
                            });
                        }
                        window.location.reload();
                    })
                    .catch(function(error) {
                        resetBranchLoading();
                        ConfirmationModal.error({
                            title: 'Unable to switch reference',
                            message: error.message || 'The selected reference could not be checked out.',
                            onClose: function() { window.location.reload(); }
                        });
                    });
                }
            });
        }

        function resetBranchLoading() {
            var branchList = document.getElementById('branch-list-container');
            var branchLoading = document.getElementById('branch-loading');
            if (branchList) branchList.classList.remove('hidden');
            if (branchLoading) branchLoading.classList.add('hidden');
        }

        function handleCreateBranchResult(event) {
            if (event.detail.successful) {
                window.location.reload();
                return;
            }

            resetBranchLoading();
            var responseText = event.detail.xhr && event.detail.xhr.responseText
                ? event.detail.xhr.responseText.trim()
                : '';
            ConfirmationModal.error({
                title: 'Unable to create branch',
                message: responseText || 'The branch could not be created.',
                onClose: function() { window.location.reload(); }
            });
        }
    </script>
</div>
